services:
  - type: web
    name: whatsapp-em-ai-agent-runner
    env: docker
    plan: free
    region: oregon
    buildCommand: docker build -t whatsapp-agent .
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 3001
      - key: HACKAI_API_KEY
        sync: false
      - key: AI_RESPONSE_MODE
        value: AUTO
